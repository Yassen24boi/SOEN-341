name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  client:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test --if-present -- --runInBand

  server:
    name: Backend Tests and Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      JWT_SECRET: test_secret
      DATABASE_URL: mongodb://127.0.0.1:27017/careerconnect_ci_test

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check database environment variable
        run: |
          node -e 'console.log("DATABASE_URL defined:", !!process.env.DATABASE_URL)'

      - name: Verify MongoDB connection
        run: |
          node -e 'const mongoose = require("mongoose"); mongoose.connect(process.env.DATABASE_URL, { serverSelectionTimeoutMS: 10000 }).then(async () => { console.log("CI MongoDB connection successful"); await mongoose.disconnect(); }).catch(err => { console.error("CI MongoDB connection failed:", err.message); process.exit(1); })'

      - name: Debug recruiter tests
        run: npx jest tests/Recruiterjobs.test.js --runInBand --detectOpenHandles --forceExit

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage/
          if-no-files-found: warn
